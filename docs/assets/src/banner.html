<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Sporty Banner</title>
<link rel="stylesheet" href="common.css">
<style>
  :root { --w: 1600px; --h: 520px; }
  .card {
    background:
      radial-gradient(700px 420px at 78% 40%, rgba(124, 58, 237, 0.38) 0%, transparent 65%),
      radial-gradient(600px 400px at 95% 100%, rgba(16, 185, 129, 0.28) 0%, transparent 60%),
      radial-gradient(500px 300px at 0% 0%, rgba(59, 130, 246, 0.25) 0%, transparent 60%),
      linear-gradient(135deg, #0b1020 0%, #111a33 55%, #0f172a 100%);
    border: 1px solid #1e293b;
  }
  .card::before { background-image: radial-gradient(rgba(148, 163, 184, 0.35) 1px, transparent 1.4px); opacity: 0.35; }
  .hero { position: absolute; left: 64px; top: 70px; z-index: 2; color: #e2e8f0; }
  .hero .eyebrow { font: 700 13px var(--mono); letter-spacing: 0.16em; color: #a5b4fc; }
  .hero h1 {
    margin-top: 14px; font-size: 104px; font-weight: 900; letter-spacing: -0.04em; line-height: 1;
    background: linear-gradient(90deg, #ffffff 0%, #c7d2fe 60%, #6ee7b7 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero h2 { margin-top: 16px; font-size: 27px; font-weight: 700; color: #f1f5f9; letter-spacing: -0.01em; }
  .hero p { margin-top: 10px; font-size: 16.5px; color: #94a3b8; font-weight: 500; }
  .chips { margin-top: 26px; display: flex; gap: 10px; flex-wrap: wrap; width: 680px; }
  .chips span {
    font: 700 13px var(--mono); color: #e2e8f0; padding: 8px 14px; border-radius: 999px;
    background: rgba(148, 163, 184, 0.12); border: 1px solid rgba(148, 163, 184, 0.28);
  }
  .chips span b { color: #6ee7b7; font-weight: 700; }
</style>
</head>
<body>
<div class="card">
  <div class="hero">
    <div class="eyebrow">LG CNS AM INSPIRE CAMP 6기 · MINI PROJECT 2</div>
    <h1>Sporty</h1>
    <h2>공공체육시설 × AI 운동 매칭 플랫폼</h2>
    <p>서울 공공체육시설을 찾고, 함께 운동할 사람을 AI로 매칭한다</p>
    <div class="chips">
      <span><b>8</b> Spring Cloud services</span>
      <span>Kafka · Outbox · Saga</span>
      <span>Spring AI · OpenAI</span>
      <span>AWS CloudFormation · k8s</span>
    </div>
  </div>
  <svg class="stage" id="stage" width="1600" height="520" viewBox="0 0 1600 520"></svg>
</div>
<script src="iso.js"></script>
<script>
isoReady(() => {
  const svg = document.getElementById('stage');
  const iso = new Iso(svg, { scale: 29, ox: 1110, oy: 172 });
  const el = isoEl;
  const W = '#ecfdf5';

  // 바닥 그림자 판
  iso.slab(-1.2, -1.2, -0.3, 14.4, 9.4, 0.3, '#1e293b', { stroke: '#334155', shadow: 'url(#shadow)' });

  // ── 풋살 코트
  iso.box(0, 0, 0, 12, 7, 0.5, '#16a34a', { gloss: false, top: '#22c55e', left: '#15803d', right: '#166534', stroke: '#14532d' });
  // 잔디 줄무늬
  for (let i = 0; i < 6; i += 2) {
    el('polygon', { points: iso.pts([[i * 2, 0, 0.5], [i * 2 + 2, 0, 0.5], [i * 2 + 2, 7, 0.5], [i * 2, 7, 0.5]]), fill: '#16a34a', opacity: 0.55 }, iso.layer);
  }
  const line = (pts) => el('polyline', { points: iso.pts(pts.map(([x, y]) => [x, y, 0.5])), fill: 'none', stroke: W, 'stroke-width': 2.2, 'stroke-linejoin': 'round', opacity: 0.92 }, iso.layer);
  line([[0.5, 0.5], [11.5, 0.5], [11.5, 6.5], [0.5, 6.5], [0.5, 0.5]]);
  line([[6, 0.5], [6, 6.5]]);
  line([[0.5, 2.0], [2.2, 2.0], [2.2, 5.0], [0.5, 5.0]]);
  line([[11.5, 2.0], [9.8, 2.0], [9.8, 5.0], [11.5, 5.0]]);
  const circ = [];
  for (let a = 0; a <= 360; a += 10) circ.push([6 + 1.3 * Math.cos((a * Math.PI) / 180), 3.5 + 1.3 * Math.sin((a * Math.PI) / 180)]);
  line(circ);
  // 골대
  const goal = (x, dir) => {
    const g = el('g', { opacity: 0.95 }, iso.layer);
    const pts = [[x, 2.7, 0.5], [x, 2.7, 1.5], [x, 4.3, 1.5], [x, 4.3, 0.5]];
    el('polyline', { points: iso.pts(pts), fill: 'none', stroke: '#f8fafc', 'stroke-width': 3, 'stroke-linejoin': 'round' }, g);
    el('polygon', { points: iso.pts([[x, 2.7, 1.5], [x - 0.6 * dir, 2.7, 1.3], [x - 0.6 * dir, 4.3, 1.3], [x, 4.3, 1.5]]), fill: '#e2e8f0', opacity: 0.25, stroke: '#e2e8f0', 'stroke-width': 1 }, g);
  };
  goal(0.5, 1);

  // ── 공
  const [bx, by] = iso.p(6.6, 3.2, 0.5);
  el('ellipse', { cx: bx + 4, cy: by + 2, rx: 17, ry: 7, fill: '#052e16', opacity: 0.45 }, iso.layer);
  const rg = el('radialGradient', { id: 'ball', cx: '35%', cy: '30%', r: '75%' }, iso.defs);
  el('stop', { offset: '0%', 'stop-color': '#ffffff' }, rg);
  el('stop', { offset: '70%', 'stop-color': '#e2e8f0' }, rg);
  el('stop', { offset: '100%', 'stop-color': '#94a3b8' }, rg);
  const by2 = by - 34;
  el('circle', { cx: bx, cy: by2, r: 17, fill: 'url(#ball)', stroke: '#64748b', 'stroke-width': 1 }, iso.layer);
  el('polygon', { points: `${bx},${by2 - 6} ${bx + 6},${by2 - 1} ${bx + 4},${by2 + 6} ${bx - 4},${by2 + 6} ${bx - 6},${by2 - 1}`, fill: '#1e293b' }, iso.layer);
  goal(11.5, -1);

  // ── 서비스 큐브 (떠 있는 블록)
  const cube = (x, y, z, s, c, label) => {
    const [sx, sy] = iso.p(x + s / 2, y + s / 2, 0.5);
    el('ellipse', { cx: sx, cy: sy + 4, rx: s * 22, ry: s * 9, fill: '#000', opacity: 0.25 }, iso.layer);
    iso.box(x, y, z, s, s, s, c, { shadow: 'url(#shadow)' });
    iso.faceText(x + 0.18, y + s, z + s * 0.45, label, { face: 'left', size: 11.5, color: '#ffffff', mono: true, weight: 700 });
  };
  // 연결선 (코트 중심 → 서비스)
  const link = (a, b, c) => iso.path3d([a, b], { color: c, dash: '3 6', width: 2, arrow: false, halo: false });
  link([6, 3.5, 0.6], [2.8, -3.0, 1.6], '#93c5fd');
  link([6, 3.5, 0.6], [7.0, -3.0, 2.0], '#6ee7b7');
  link([6, 3.5, 0.6], [11.2, -2.4, 1.4], '#fcd34d');
  link([6, 3.5, 0.6], [15.0, 2.0, 1.8], '#f9a8d4');

  cube(-4.6, 2.0, 1.0, 2.6, '#7c3aed', 'gateway');
  cube(1.6, -4.4, 1.2, 2.2, '#3b82f6', 'user');
  cube(5.8, -4.6, 1.8, 2.4, '#10b981', 'match');
  cube(10.0, -3.8, 1.0, 2.2, '#f59e0b', 'facility');
  cube(14.2, 0.6, 1.5, 2.3, '#ec4899', 'ai');
  cube(13.8, 5.0, 0.7, 1.8, '#ef4444', 'notify');

  // Kafka 링
  iso.box(-0.8, 9.0, 0.0, 12.4, 1.0, 0.45, '#0f172a', { gloss: false, stroke: '#475569' });
  iso.faceText(-0.4, 10.0, 0.22, 'kafka · outbox → topics → saga', { face: 'left', size: 9, color: '#fdba74', mono: true });
});
</script>
</body>
</html>
