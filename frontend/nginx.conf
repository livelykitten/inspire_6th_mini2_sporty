# 담당: 반정욱 (@salieri009) · 작업 위치: frontend/nginx.conf
# / 는 정적 파일(SPA), /api/ 는 gateway 로 프록시한다. /internal/ 등 그 밖의 경로는 gateway 로 보내지 않는다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compose 네트워크의 DNS. 변수로 넘기면 gateway 가 아직 없어도 nginx 가 기동하고 요청 때 주소를 푼다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $gateway http://gateway-service:8000;
        proxy_pass $gateway$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ALB / compose 헬스체크용
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # SPA 라우팅: 없는 경로는 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
