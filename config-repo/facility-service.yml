# 공공데이터 API 키는 .env 의 PUBLIC_DATA_API_KEY
facility:
  openapi:
    service-key: ${PUBLIC_DATA_API_KEY:}
    base-url: ${PUBLIC_DATA_API_URL:http://openapi.seoul.go.kr:8088/}
    service-name: ListPublicReservationSport
    data-type: json
  sync:
    cron: "0 0 3 * * *"
    zone: "Asia/Seoul"
    on-startup: ${FACILITY_SYNC_ON_STARTUP:true}
