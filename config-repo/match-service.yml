# match-service 설정 (W-24). 비밀값은 ${환경변수} 로만 두고 값은 각자 .env (로컬) 에 있다
spring:
  datasource:
    driver-class-name: ${DB_DRIVER:org.mariadb.jdbc.Driver}
    url: ${DB_URL:jdbc:mariadb://localhost:3307/match_db}
    username: ${DB_USERNAME:match_svc}
    password: ${DB_PASSWORD:match_svc}
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
