name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    # wip 서비스는 1차 코드의 서비스 경계 import 가 남아 있어 아직 컴파일되지 않는다 (docs/msa-split-todo.md).
    # 해당 서비스의 이동 PR(W-07 ~ W-10)이 머지되면 그 줄의 wip 를 지운다.
    continue-on-error: ${{ matrix.wip }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: gateway-service, wip: false }
          - { service: discovery-service, wip: false }
          - { service: config-service, wip: false }
          - { service: facility-service, wip: false }
          - { service: user-service, wip: true } # W-07
          - { service: match-service, wip: false } # W-08
          - { service: ai-service, wip: true } # W-10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 컴파일
        run: ./gradlew :${{ matrix.service }}:compileJava :${{ matrix.service }}:compileTestJava

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 테스트
        run: npm test -- --watchAll=false
        env:
          CI: "true"

      - name: 빌드
        run: npm run build
        env:
          CI: "false"
