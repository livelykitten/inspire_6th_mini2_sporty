# 바깥 진입점: Gateway(localhost:8000) · 프론트 nginx(localhost:8080).
# Docker Desktop 의 LoadBalancer Service 는 localhost:<port> 로 연결된다.
# Service 를 Deployment 보다 먼저 둔다 (프론트 nginx 가 기동할 때 gateway-service 이름을 찾는다).

apiVersion: v1
kind: Service
metadata: { name: gateway-service, namespace: sporty }
spec:
  type: LoadBalancer
  selector: { app: gateway-service }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: sporty }
spec:
  type: LoadBalancer
  selector: { app: frontend }
  ports: [{ port: 8080, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway-service, namespace: sporty, labels: { app: gateway-service, tier: edge } }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway-service } }
  template:
    metadata: { labels: { app: gateway-service, tier: edge } }
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until wget -q -O /dev/null http://config-service:8888/actuator/health && wget -q -O /dev/null http://user-service:8001/actuator/health; do echo 'config · user-service 대기'; sleep 3; done"]
      containers:
        - name: app
          image: sporty/gateway-service:local
          imagePullPolicy: Never
          envFrom: [{ configMapRef: { name: sporty-app-env } }]
          env:
            - { name: JWT_SECRET_KEY, valueFrom: { secretKeyRef: { name: sporty-secrets, key: JWT_SECRET_KEY } } }
            - { name: CORS_ALLOWED_ORIGIN, value: "http://localhost:8080" }
          ports: [{ containerPort: 8000 }]
          startupProbe: { httpGet: { path: /actuator/health, port: 8000 }, periodSeconds: 10, failureThreshold: 30 }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8000 }, periodSeconds: 10 }
          resources: { requests: { memory: 320Mi }, limits: { memory: 640Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: sporty, labels: { app: frontend, tier: edge } }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend, tier: edge } }
    spec:
      enableServiceLinks: false
      containers:
        - name: nginx
          image: sporty/frontend:local
          imagePullPolicy: Never
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /healthz, port: 80 }, periodSeconds: 10 }
          resources: { requests: { memory: 16Mi }, limits: { memory: 64Mi } }
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
      volumes:
        - name: nginx-conf
          configMap: { name: frontend-nginx }
