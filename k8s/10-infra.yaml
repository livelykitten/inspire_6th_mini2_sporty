# ---------- Redis (Refresh Token) ----------
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: sporty, labels: { app: redis, tier: infra } }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis, tier: infra } }
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          resources: { requests: { memory: 32Mi }, limits: { memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: sporty }
spec: { selector: { app: redis }, ports: [{ port: 6379, targetPort: 6379 }] }
---
# ---------- Kafka (KRaft 단일 노드) ----------
# compose 와 달리 EXTERNAL(localhost:9092) 리스너는 두지 않는다. 클러스터 안에서는 kafka:29092 만 쓴다.
apiVersion: apps/v1
kind: Deployment
metadata: { name: kafka, namespace: sporty, labels: { app: kafka, tier: infra } }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka, tier: infra } }
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENERS, value: "INTERNAL://:29092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka:29092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
            - { name: KAFKA_NUM_PARTITIONS, value: "1" }
          ports: [{ containerPort: 29092 }]
          # kafka-topics.sh 는 실행마다 JVM 을 새로 띄워 10초 안에 못 끝난다(LG 노트북 실측: 31회 연속 시간 초과).
          # 포트가 열렸는지만 본다. 토픽 생성 확인은 kafka-init Job 이 한다.
          readinessProbe:
            tcpSocket: { port: 29092 }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources: { requests: { memory: 384Mi }, limits: { memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: sporty }
spec: { selector: { app: kafka }, ports: [{ name: internal, port: 29092, targetPort: 29092 }] }
---
# compose 의 kafka-init 과 같은 토픽 4개 + DLT 4개를 만든다 (한 번 돌고 끝나는 Job).
apiVersion: batch/v1
kind: Job
metadata: { name: kafka-init, namespace: sporty }
spec:
  backoffLimit: 6
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: apache/kafka:3.9.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do echo "kafka 대기"; sleep 5; done
              for t in facility.service.changed user.withdrawal.requested match.withdrawal.completed match.withdrawal.failed; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$t" --partitions 1 --replication-factor 1
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$t.DLT" --partitions 1 --replication-factor 1
              done
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
---
# ---------- Zipkin (분산 추적) ----------
apiVersion: apps/v1
kind: Deployment
metadata: { name: zipkin, namespace: sporty, labels: { app: zipkin, tier: infra } }
spec:
  replicas: 1
  selector: { matchLabels: { app: zipkin } }
  template:
    metadata: { labels: { app: zipkin, tier: infra } }
    spec:
      enableServiceLinks: false
      containers:
        - name: zipkin
          image: openzipkin/zipkin:3
          env: [{ name: STORAGE_TYPE, value: mem }]
          ports: [{ containerPort: 9411 }]
          resources: { requests: { memory: 128Mi }, limits: { memory: 384Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: zipkin, namespace: sporty }
spec:
  type: LoadBalancer
  selector: { app: zipkin }
  ports: [{ port: 9411, targetPort: 9411 }]
