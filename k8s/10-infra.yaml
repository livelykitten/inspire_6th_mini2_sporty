# 인프라: DB 3대 · Redis · Kafka · Zipkin + 토픽 생성 Job.
# compose.yaml 과 같은 이미지 · 같은 서비스 이름을 써서 앱 쪽 접속 주소(user-db:3306, kafka:29092 …)가 compose.app.yaml 과 같다.
# 데이터는 emptyDir(파드를 지우면 사라짐). 시연 · 검증용 로컬 클러스터라 영구 볼륨을 두지 않는다.
# enableServiceLinks: false = 쿠버네티스가 넣는 KAFKA_PORT 같은 환경변수가 Kafka 설정으로 잘못 읽히는 것을 막는다.

# ---------- MariaDB 3대 (서비스별 DB) ----------
apiVersion: apps/v1
kind: Deployment
metadata: { name: user-db, namespace: sporty, labels: { app: user-db, tier: infra } }
spec:
  replicas: 1
  selector: { matchLabels: { app: user-db } }
  template:
    metadata: { labels: { app: user-db, tier: infra } }
    spec:
      enableServiceLinks: false
      containers:
        - name: mariadb
          image: mariadb:11
          args: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
          env:
            - { name: MARIADB_ROOT_PASSWORD, value: root }
            - { name: MARIADB_DATABASE, value: user_db }
            - { name: MARIADB_USER, value: user_svc }
            - { name: MARIADB_PASSWORD, value: user_svc }
            - { name: TZ, value: Asia/Seoul }
          ports: [{ containerPort: 3306 }]
          readinessProbe:
            exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
            periodSeconds: 5
          resources: { requests: { memory: 128Mi }, limits: { memory: 384Mi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: user-db, namespace: sporty }
spec: { selector: { app: user-db }, ports: [{ port: 3306, targetPort: 3306 }] }
---
