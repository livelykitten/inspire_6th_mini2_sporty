        awslogs-create-group: "false"
  match-service:
    logging:
      <<: *awslogs
      options:
        awslogs-region: ${AWS_REGION:?AWS_REGION 을 설정하세요}
        awslogs-group: /${PROJECT_NAME:-sporty}/${ENV_NAME:-prod}/match-service
        awslogs-create-group: "false"
  facility-service:
    logging:
      <<: *awslogs
      options:
        awslogs-region: ${AWS_REGION:?AWS_REGION 을 설정하세요}
        awslogs-group: /${PROJECT_NAME:-sporty}/${ENV_NAME:-prod}/facility-service
        awslogs-create-group: "false"
  ai-service:
