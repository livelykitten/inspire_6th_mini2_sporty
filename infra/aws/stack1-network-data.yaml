    Export: { Name: !Sub "${AWS::StackName}-MatchDbIdentifier" }
  FacilityDbIdentifier:
    Value: !Ref FacilityDb
    Export: { Name: !Sub "${AWS::StackName}-FacilityDbIdentifier" }
  DbPasswordUserArn:
