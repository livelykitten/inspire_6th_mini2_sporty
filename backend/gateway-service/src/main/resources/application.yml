server:
  port: 8000

# 라우트 · CORS · jwt.secret 은 Config 서버(config-repo/gateway-service.yml)에서 받는다 (W-24).
# Config 서버가 없으면 라우트가 없어 모든 요청이 404 이므로 config-service 를 먼저 띄운다
spring:
  application:
    name: gateway-service
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:configserver:"

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info
