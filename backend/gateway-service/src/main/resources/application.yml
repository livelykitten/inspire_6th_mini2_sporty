server:
  port: 8000

spring:
  application:
    name: gateway-service
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:configserver:"
  cloud:
    gateway:
      server:
        webflux:
          # 1차 SecurityConfig 37-41행 값 그대로 (오리진만 배포용으로 바꿀 수 있게 환경변수). 서비스 쪽 CORS 는 각 담당이 제거
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
                allowed-methods: GET, POST, PUT, PATCH, DELETE, OPTIONS
                allowed-headers: Authorization, Content-Type, Refresh-Token
                exposed-headers: Authorization
                allow-credentials: true
          default-filters:
            # 서비스에 CORS 가 남아 있어도 헤더가 두 번 붙지 않게 (두 번 붙으면 브라우저가 막음)
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          # 경로는 바꾸지 않고 그대로 전달 (RewritePath · StripPrefix 없음)
          # /internal/** 은 라우트가 없으므로 밖에서 부르면 404 (서비스끼리 Feign 으로만 사용)
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**, /api/auth/**, /api/profiles/**
            - id: match-service
              uri: lb://match-service
              predicates:
                - Path=/api/matches/**
            - id: facility-service
              uri: lb://facility-service
              predicates:
                - Path=/api/services/**
            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/api/ai/**

# user-service 와 같은 로컬 전용 값 (.env 의 JWT_SECRET_KEY, 32바이트 이상)
jwt:
  secret: ${JWT_SECRET_KEY}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info
