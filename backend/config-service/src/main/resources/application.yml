server:
  port: 8888

spring:
  application:
    name: config-service
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_PATH:file:../../config-repo}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info
