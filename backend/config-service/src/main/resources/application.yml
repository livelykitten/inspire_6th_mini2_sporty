server:
  port: 8888

spring:
  application:
    name: config-service
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_PATH:file:../../config-repo}

management:
  endpoints:
    web:
      exposure:
        include: health,info
