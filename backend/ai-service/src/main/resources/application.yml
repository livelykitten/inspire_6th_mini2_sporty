server:
  port: 8004

# Local mock server. Set an empty URL to use service discovery instead.
clients:
  match-service:
    url: ${MATCH_SERVICE_URL:http://localhost:18002}

spring:
  application:
    name: ai-service
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:configserver:"
  ai:
    openai:
      api-key: ${OPEN_AI_KEY:}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info
