server:
  port: 8004

spring:
  application:
    name: ai-service
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 2000
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:file:./ai-service/.env[.properties]"
      - "optional:configserver:"
  ai:
    retry:
      # One attempt, with no automatic retries extending the OpenAI timeout.
      max-attempts: 1
    openai:
      api-key: ${OPEN_AI_KEY:}

# Applied to synchronous OpenAI HTTP calls by OpenAiHttpClientConfig.
ai:
  openai:
    timeout: 10s

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info
