server:
  port: 8761

spring:
  application:
    name: discovery-service
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
