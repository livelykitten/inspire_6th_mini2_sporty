server:
  port: 8003

spring:
  application:
    name: facility-service
  task:
    scheduling:
      pool:
        size: 2
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:configserver:"
  datasource:
    driver-class-name: ${DB_DRIVER:org.mariadb.jdbc.Driver}
    url: ${DB_URL:jdbc:mariadb://localhost:3306/facility_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info

facility:
  openapi:
    service-key: ${PUBLIC_DATA_API_KEY:}
    base-url: ${PUBLIC_DATA_API_URL:}
    service-name: ListPublicReservationSport
    data-type: json
  sync:
    cron: "0 0 3 * * *"
    zone: "Asia/Seoul"
    on-startup: ${FACILITY_SYNC_ON_STARTUP:true}