name: sporty-ai-mocks

services:
  match-mock:
    image: wiremock/wiremock:3.13.1
    ports:
      - "127.0.0.1:18002:8080"
    volumes:
      - ./match-service/mappings:/home/wiremock/mappings:ro
      - ./match-service/__files:/home/wiremock/__files:ro

  user-mock:
    image: wiremock/wiremock:3.13.1
    ports:
      - "127.0.0.1:18001:8080"
    volumes:
      - ./user-service/mappings:/home/wiremock/mappings:ro
      - ./user-service/__files:/home/wiremock/__files:ro
